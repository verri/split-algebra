name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain of `lean-toolchain`, fetches the Mathlib cache, runs `lake build`.
      - uses: leanprover/lean-action@v1
      - name: Axiom gate
        run: lake env lean AxiomCheck.lean
